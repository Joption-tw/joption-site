<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙賣動態平衡模擬器</title>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 避免 Google Sites iframe 捲軸問題，設定基本樣式 */
        body { margin: 0; padding: 0; background-color: #f3f4f6; }
        
        /* 蹺蹺板專用樣式 */
        .wood-texture {
            background-color: #8B4513;
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.1) 75%, transparent 75%, transparent);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 設計師款圖示組件 (Custom Designed Icons) ---
        
        // 1. App Logo: 蹺蹺板意象 (左紅右綠)
        const SeesawLogo = ({ size = 48, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
                <rect width="64" height="64" rx="16" fill="#EFF6FF"/>
                <path d="M32 50L26 58H38L32 50Z" fill="#4B5563"/>
                <rect x="12" y="46" width="40" height="4" rx="2" fill="#1F2937" transform="rotate(-5 32 48)"/>
                <circle cx="16" cy="42" r="6" fill="#EF4444" transform="rotate(-5 32 48)" stroke="white" strokeWidth="2"/>
                <circle cx="48" cy="42" r="6" fill="#10B981" transform="rotate(-5 32 48)" stroke="white" strokeWidth="2"/>
            </svg>
        );

        // 2. 市場上漲: 圓底箭頭 (更具按鈕感)
        const MarketUpIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
                <circle cx="12" cy="12" r="10" fill="currentColor" fillOpacity="0.15"/>
                <path d="M12 16V8M12 8L8 12M12 8L16 12" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
        );

        // 3. 市場下跌: 圓底箭頭
        const MarketDownIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
                <circle cx="12" cy="12" r="10" fill="currentColor" fillOpacity="0.15"/>
                <path d="M12 8V16M12 16L8 12M12 16L16 12" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
        );

        // 4. 狀態平衡: 勾勾
        const CheckCircleIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
        );

        // 5. 狀態警示: 三角驚嘆號
        const WarningIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                <line x1="12" y1="9" x2="12" y2="13" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
        );

        // 6. 重置: 圓形箭頭
        const ResetIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                <path d="M16 21h5v-5" />
            </svg>
        );

        // 7. 資訊: 圓圈 i
        const InfoIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
        );

        // --- 輔助函數與常數 ---

        // 模擬權利金計算 (改用雙曲線模型以模擬真實 Gamma 效應)
        const calculatePremium = (type, strike, spotPrice) => {
            // distance: 正值代表價內(ITM)方向，負值代表價外(OTM)方向
            // Call: 漲是獲利方向 (Spot - Strike)
            // Put: 跌是獲利方向 (Strike - Spot)
            const distance = type === 'call' ? spotPrice - strike : strike - spotPrice;
            
            // k 是平滑參數 (類似波動率平方的概念)
            // 校正：當 distance = -100 (價外100點) 時，Price ≈ 250
            // 公式：250 = (-100 + sqrt(10000 + k)) / 2
            // 解得 k = 350000
            const k = 350000; 

            // 雙曲線近似公式：Price ≈ (x + sqrt(x^2 + k)) / 2
            // 特性：
            // 1. 永遠大於 0 (如同真實權利金)
            // 2. 曲線是凸的 (Convex)，代表 Gamma > 0
            // 3. 當 distance 變大，斜率(Delta)會逐漸增加趨近於 1 -> 符合「漲越快」的需求
            const price = (distance + Math.sqrt(distance * distance + k)) / 2;

            return Math.round(price);
        };

        // 格式化數字
        const fmt = (num) => new Intl.NumberFormat('zh-TW').format(Math.round(num));

        // --- 主應用程式組件 ---
        const DynamicBalancingApp = () => {
            // --- 狀態管理 ---
            
            // 市場狀態 (初始 30000)
            const [spotPrice, setSpotPrice] = useState(30000);
            const [cash, setCash] = useState(5000000); // 模擬保證金/現金
            const [marginUsed, setMarginUsed] = useState(0);
            
            // 持倉狀態 (初始化為 40 口，對應單價約 250，總點數 10000)
            const [positions, setPositions] = useState([
                { id: 1, type: 'put', side: 'sell', strike: 29900, quantity: 40, entryPrice: 250 }, 
                { id: 2, type: 'call', side: 'sell', strike: 30100, quantity: 40, entryPrice: 250 }, 
            ]);

            // 歷史記錄
            const [logs, setLogs] = useState([]);

            // --- 計算邏輯 ---
            const portfolioStatus = useMemo(() => {
                let callTotalPoints = 0;
                let putTotalPoints = 0;
                let currentMargin = 0;

                const calculatedPositions = positions.map(pos => {
                    const currentPrice = calculatePremium(pos.type, pos.strike, spotPrice);
                    const totalPoints = currentPrice * pos.quantity;
                    
                    const marginPerUnit = 50000;
                    currentMargin += marginPerUnit * pos.quantity;

                    if (pos.type === 'call') callTotalPoints += totalPoints;
                    if (pos.type === 'put') putTotalPoints += totalPoints;

                    return { ...pos, currentPrice, totalPoints };
                });

                const totalPoints = callTotalPoints + putTotalPoints;
                const balanceRatio = totalPoints === 0 ? 0 : (callTotalPoints / totalPoints) * 100;

                return {
                    callTotalPoints,
                    putTotalPoints,
                    balanceRatio,
                    calculatedPositions,
                    currentMargin
                };
            }, [positions, spotPrice]);

            useEffect(() => {
                setMarginUsed(portfolioStatus.currentMargin);
            }, [portfolioStatus.currentMargin]);

            // --- 操作函數 ---
            const simulateMarketMove = (delta) => {
                const newPrice = spotPrice + delta;
                setSpotPrice(newPrice);
                addLog(`市場波動: 指數 ${delta > 0 ? '上漲' : '下跌'} ${Math.abs(delta)} 點，目前 ${newPrice}`);
            };

            const executeTrade = (type, strike, quantity, action) => {
                const currentPrem = calculatePremium(type, strike, spotPrice);
                
                setPositions(prev => {
                    const existingIdx = prev.findIndex(p => p.type === type && p.strike === strike);
                    let newPositions = [...prev];

                    if (action === 'sell') {
                        if (existingIdx >= 0) {
                            newPositions[existingIdx].quantity += quantity;
                        } else {
                            newPositions.push({
                                id: Date.now(),
                                type,
                                side: 'sell',
                                strike,
                                quantity,
                                entryPrice: currentPrem
                            });
                        }
                        addLog(`策略執行: 賣出 (Sell) ${type.toUpperCase()} ${strike} x ${quantity} 口`);
                    } else {
                        if (existingIdx >= 0) {
                            if (newPositions[existingIdx].quantity > quantity) {
                                newPositions[existingIdx].quantity -= quantity;
                            } else {
                                newPositions = newPositions.filter((_, idx) => idx !== existingIdx);
                            }
                            addLog(`策略執行: 買回 (Buy) ${type.toUpperCase()} ${strike} x ${quantity} 口`);
                        }
                    }
                    return newPositions;
                });
            };

            const addLog = (msg) => {
                setLogs(prev => [{ time: new Date().toLocaleTimeString(), msg }, ...prev].slice(0, 5));
            };

            const resetSimulation = () => {
                setSpotPrice(30000);
                setPositions([
                    { id: 1, type: 'put', side: 'sell', strike: 29900, quantity: 40, entryPrice: 250 },
                    { id: 2, type: 'call', side: 'sell', strike: 30100, quantity: 40, entryPrice: 250 },
                ]);
                setLogs([]);
                addLog("模擬重置：回到初始平衡狀態 (30000點，雙邊各10000)");
            };

            // --- 策略建議邏輯 (40-60% 區間) ---
            const getStrategyAdvice = () => {
                const { balanceRatio } = portfolioStatus;
                const isRich = cash - marginUsed > 1000000; 

                if (balanceRatio >= 40 && balanceRatio <= 60) {
                    return { status: 'balanced', text: '目前處於平衡狀態 (40% - 60%)，無需調整。', color: 'text-green-600', bg: 'bg-green-50' };
                }

                if (balanceRatio < 40) {
                    return {
                        status: 'imbalanced-low',
                        title: '平衡向 PUT 傾斜 (市場可能下跌)',
                        text: isRich 
                            ? '建議：錢夠多 -> Sell Call (賣出 Call 增加 Call 端權利金)' 
                            : '建議：錢不夠 -> Buy Put (買回 Put 減少 Put 端權利金)',
                        action: isRich ? 'add_call' : 'reduce_put',
                        color: 'text-red-600',
                        bg: 'bg-red-50'
                    };
                }

                if (balanceRatio > 60) {
                    return {
                        status: 'imbalanced-high',
                        title: '平衡向 CALL 傾斜 (市場可能上漲)',
                        text: isRich 
                            ? '建議：錢夠多 -> Sell Put (賣出 Put 增加 Put 端權利金)' 
                            : '建議：錢不夠 -> Buy Call (買回 Call 減少 Call 端權利金)',
                        action: isRich ? 'add_put' : 'reduce_call',
                        color: 'text-red-600',
                        bg: 'bg-red-50'
                    };
                }
            };

            const advice = getStrategyAdvice();

            // --- 蹺蹺板計算 ---
            // 比例 50% = 0度
            // 比例 100% (Call heavy) = Call 側下沉 = 左側下沉 = 逆時針旋轉 (負角度)
            // 比例 0% (Put heavy) = Put 側下沉 = 右側下沉 = 順時針旋轉 (正角度)
            // 最大旋轉角度設定為 30 度
            const rotationDegree = (50 - portfolioStatus.balanceRatio) * 0.6; 
            // 限制最大角度以免翻車
            const clampedRotation = Math.max(-30, Math.min(30, rotationDegree));

            return (
                <div className="min-h-screen bg-gray-100 p-4 md:p-8 font-sans text-gray-800">
                    <div className="max-w-6xl mx-auto space-y-6 border-[6px] border-double border-blue-200 rounded-3xl p-4 md:p-6 bg-white/50 shadow-xl">
                        
                        {/* 標題區 */}
                        <header className="bg-white rounded-xl shadow-sm p-6 flex flex-col md:flex-row justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-bold text-gray-900 flex items-center gap-2">
                                    {/* 使用新的 SeesawLogo */}
                                    <SeesawLogo className="mr-2" />
                                    雙賣動態平衡策略模擬
                                </h1>
                                <p className="text-gray-500 text-sm mt-1 ml-14">
                                    依據權利金總點數進行 Delta Neutral (中性) 動態調整
                                </p>
                            </div>
                            <div className="flex gap-2 mt-4 md:mt-0">
                                <button 
                                    onClick={resetSimulation}
                                    className="flex items-center gap-2 px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg transition"
                                >
                                    <ResetIcon size={18} /> 重置模擬
                                </button>
                            </div>
                        </header>

                        {/* 核心儀表板 */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            
                            {/* 左側：市場與帳戶資訊 */}
                            <div className="bg-white rounded-xl shadow-sm p-6 space-y-4">
                                <h2 className="text-lg font-semibold text-gray-700 border-b pb-2">市場狀態</h2>
                                
                                <div className="text-center py-4 bg-gray-50 rounded-lg border border-gray-200">
                                    <div className="text-sm text-gray-500">加權指數 Spot Price</div>
                                    <div className="text-4xl font-bold text-blue-900">{spotPrice}</div>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <button 
                                        onClick={() => simulateMarketMove(50)}
                                        className="flex flex-col items-center justify-center p-3 bg-red-50 hover:bg-red-100 text-red-700 rounded-lg border border-red-200 transition"
                                    >
                                        <MarketUpIcon size={32} className="mb-1"/>
                                        <span className="font-bold">上漲 50 點</span>
                                    </button>
                                    <button 
                                        onClick={() => simulateMarketMove(-50)}
                                        className="flex flex-col items-center justify-center p-3 bg-green-50 hover:bg-green-100 text-green-700 rounded-lg border border-green-200 transition"
                                    >
                                        <MarketDownIcon size={32} className="mb-1"/>
                                        <span className="font-bold">下跌 50 點</span>
                                    </button>
                                </div>

                                <div className="space-y-2 text-sm mt-4">
                                    <div className="flex justify-between">
                                        <span>可用資金:</span>
                                        <span className="font-mono font-bold text-gray-700">{fmt(cash)}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span>已用保證金:</span>
                                        <span className="font-mono text-orange-600">{fmt(marginUsed)}</span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2 mt-1">
                                        <div 
                                            className="bg-orange-500 h-2 rounded-full" 
                                            style={{ width: `${Math.min((marginUsed/cash)*100, 100)}%` }}
                                        ></div>
                                    </div>
                                    <div className="text-xs text-center text-gray-400">資金水位 (模擬 "錢夠多/錢不夠")</div>
                                </div>
                            </div>

                            {/* 中間：平衡天平 (核心視覺 - 蹺蹺板版) */}
                            <div className="md:col-span-2 bg-white rounded-xl shadow-sm p-6 flex flex-col justify-center">
                                <h2 className="text-lg font-semibold text-gray-700 border-b pb-2 mb-4 flex items-center justify-between">
                                    <span>動態平衡監控</span>
                                    <span className={`text-sm px-2 py-1 rounded font-bold flex items-center gap-1 ${advice.status === 'balanced' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                        {advice.status === 'balanced' ? <CheckCircleIcon size={16}/> : <WarningIcon size={16}/>}
                                        {advice.status === 'balanced' ? '平衡' : '失衡'}
                                    </span>
                                </h2>

                                {/* 數值顯示 */}
                                <div className="flex items-end justify-between px-4 mb-2">
                                    <div className="text-center w-1/3">
                                        <div className="text-2xl font-bold text-red-600">{fmt(portfolioStatus.callTotalPoints)}</div>
                                        <div className="text-xs text-gray-500">Call 總點數</div>
                                    </div>
                                    
                                    <div className="text-center w-1/3 pb-2">
                                        <div className="text-3xl font-black text-purple-700">
                                            {portfolioStatus.balanceRatio.toFixed(1)}%
                                        </div>
                                        <div className="text-xs text-gray-400">Call / (Call + Put)</div>
                                    </div>

                                    <div className="text-center w-1/3">
                                        <div className="text-2xl font-bold text-green-600">{fmt(portfolioStatus.putTotalPoints)}</div>
                                        <div className="text-xs text-gray-500">Put 總點數</div>
                                    </div>
                                </div>

                                {/* 蹺蹺板視覺化 (Seesaw Visualization) */}
                                <div className="relative w-full h-40 flex justify-center items-end overflow-hidden pb-4">
                                    
                                    {/* 支點 (Fulcrum) */}
                                    <div className="absolute bottom-4 w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-b-[40px] border-b-gray-600 z-10 flex justify-center">
                                        {/* 支點軸心 */}
                                        <div className="absolute top-[20px] w-3 h-3 bg-gray-300 rounded-full border border-gray-500"></div>
                                    </div>

                                    {/* 蹺蹺板木板 (Plank) - 根據 rotationDegree 旋轉 */}
                                    <div 
                                        className="w-3/4 h-3 wood-texture rounded shadow-lg relative transition-transform duration-700 ease-out border-b-4 border-amber-900"
                                        style={{ 
                                            transform: `rotate(${clampedRotation}deg)`, 
                                            transformOrigin: 'center bottom',
                                            marginBottom: '35px' // 讓板子架在支點上
                                        }}
                                    >
                                        {/* 左側籌碼 (Call - Red) */}
                                        <div className="absolute -top-14 left-4 flex flex-col items-center">
                                            <div className="w-16 h-14 bg-gradient-to-b from-red-400 to-red-600 rounded-lg shadow-md border-b-4 border-red-800 flex items-center justify-center text-white font-bold text-sm z-20">
                                                CALL
                                            </div>
                                            {/* 重量陰影 */}
                                            <div className="w-14 h-1 bg-black/20 blur-sm rounded-full mt-0.5"></div>
                                        </div>

                                        {/* 右側籌碼 (Put - Green) */}
                                        <div className="absolute -top-14 right-4 flex flex-col items-center">
                                            <div className="w-16 h-14 bg-gradient-to-b from-green-400 to-green-600 rounded-lg shadow-md border-b-4 border-green-800 flex items-center justify-center text-white font-bold text-sm z-20">
                                                PUT
                                            </div>
                                            {/* 重量陰影 */}
                                            <div className="w-14 h-1 bg-black/20 blur-sm rounded-full mt-0.5"></div>
                                        </div>
                                    </div>

                                </div>
                                
                                <div className="flex justify-between text-xs text-gray-400 -mt-2 px-8">
                                    <span>Call 重 (Ratio &gt; 60%)</span>
                                    <span>平衡 (50%)</span>
                                    <span>Put 重 (Ratio &lt; 40%)</span>
                                </div>

                                {/* 策略建議卡片 */}
                                <div className={`mt-6 p-4 rounded-lg border-l-4 transition-all duration-300 ${advice.bg} ${advice.status === 'balanced' ? 'border-green-500' : 'border-red-500'}`}>
                                    <div className="flex items-start gap-3">
                                        {advice.status === 'balanced' ? <CheckCircleIcon className="text-green-600 mt-1" /> : <WarningIcon className="text-red-600 mt-1" />}
                                        <div>
                                            <h3 className={`font-bold ${advice.color}`}>{advice.title || '系統狀態正常'}</h3>
                                            <p className="text-gray-700 mt-1 text-sm md:text-base whitespace-pre-line font-medium">
                                                {advice.text}
                                            </p>
                                            
                                            {/* 快捷操作按鈕 */}
                                            {advice.action && (
                                                <div className="mt-3 flex gap-2">
                                                    <span className="text-xs text-gray-500 self-center">快速執行:</span>
                                                    {advice.action === 'add_call' && (
                                                        <button onClick={() => executeTrade('call', spotPrice + 100, 5, 'sell')} className="px-3 py-1 bg-red-600 text-white rounded text-sm hover:bg-red-700 shadow">
                                                            Sell Call (10口)
                                                        </button>
                                                    )}
                                                    {advice.action === 'reduce_put' && (
                                                        <button onClick={() => executeTrade('put', 29900, 5, 'buy')} className="px-3 py-1 bg-green-600 text-white rounded text-sm hover:bg-green-700 shadow">
                                                            Buy Put (5口)
                                                        </button>
                                                    )}
                                                    {advice.action === 'add_put' && (
                                                        <button onClick={() => executeTrade('put', spotPrice - 100, 5, 'sell')} className="px-3 py-1 bg-green-600 text-white rounded text-sm hover:bg-green-700 shadow">
                                                            Sell Put (10口)
                                                        </button>
                                                    )}
                                                    {advice.action === 'reduce_call' && (
                                                        <button onClick={() => executeTrade('call', 30100, 5, 'buy')} className="px-3 py-1 bg-red-600 text-white rounded text-sm hover:bg-red-700 shadow">
                                                            Buy Call (5口)
                                                        </button>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                        {/* 底部：持倉詳情與互動操作 (保持不變) */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            
                            {/* 左下：目前倉位 */}
                            <div className="bg-white rounded-xl shadow-sm p-6 overflow-hidden">
                                <h2 className="text-lg font-semibold text-gray-700 border-b pb-2 mb-4">當前倉位明細</h2>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-gray-700 uppercase bg-gray-50">
                                            <tr>
                                                <th className="px-3 py-2">類型</th>
                                                <th className="px-3 py-2">履約價</th>
                                                <th className="px-3 py-2">口數</th>
                                                <th className="px-3 py-2">目前權利金</th>
                                                <th className="px-3 py-2">總點數</th>
                                                <th className="px-3 py-2">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {portfolioStatus.calculatedPositions.length === 0 && (
                                                <tr><td colSpan="6" className="text-center py-4 text-gray-400">目前無倉位</td></tr>
                                            )}
                                            {portfolioStatus.calculatedPositions.map((pos) => (
                                                <tr key={pos.id} className="bg-white border-b hover:bg-gray-50">
                                                    <td className={`px-3 py-2 font-bold ${pos.type === 'call' ? 'text-red-600' : 'text-green-600'}`}>
                                                        {pos.side === 'sell' ? 'Sell' : 'Buy'} {pos.type.toUpperCase()}
                                                    </td>
                                                    <td className="px-3 py-2">{pos.strike}</td>
                                                    <td className="px-3 py-2 font-mono">{pos.quantity}</td>
                                                    <td className="px-3 py-2 text-gray-500">{pos.currentPrice}</td>
                                                    <td className="px-3 py-2 font-bold text-gray-900">{fmt(pos.totalPoints)}</td>
                                                    <td className="px-3 py-2">
                                                        <div className="flex gap-1">
                                                            <button 
                                                                onClick={() => executeTrade(pos.type, pos.strike, 1, 'sell')}
                                                                className="px-2 py-0.5 bg-gray-100 hover:bg-gray-200 rounded text-xs text-gray-600"
                                                                title="加倉"
                                                            >
                                                                +
                                                            </button>
                                                            <button 
                                                                onClick={() => executeTrade(pos.type, pos.strike, 1, 'buy')}
                                                                className="px-2 py-0.5 bg-gray-100 hover:bg-gray-200 rounded text-xs text-gray-600"
                                                                title="減倉"
                                                            >
                                                                -
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* 右下：手動交易面板 & 紀錄 */}
                            <div className="bg-white rounded-xl shadow-sm p-6 flex flex-col">
                                <h2 className="text-lg font-semibold text-gray-700 border-b pb-2 mb-4">自定義調整</h2>
                                
                                <div className="grid grid-cols-2 gap-4 mb-6">
                                    <div className="border border-red-100 rounded-lg p-3 bg-red-50/50">
                                        <h4 className="text-red-800 font-bold text-sm mb-2 text-center">CALL (看空/中性)</h4>
                                        <div className="flex gap-2 justify-center">
                                            <button 
                                                onClick={() => executeTrade('call', spotPrice + 100, 5, 'sell')}
                                                className="flex-1 px-2 py-2 bg-white border border-red-300 text-red-700 rounded hover:bg-red-50 text-xs font-medium shadow-sm"
                                            >
                                                Sell Call
                                            </button>
                                            <button 
                                                onClick={() => executeTrade('call', 30100, 5, 'buy')}
                                                className="flex-1 px-2 py-2 bg-white border border-red-300 text-red-700 rounded hover:bg-red-50 text-xs font-medium shadow-sm"
                                            >
                                                Buy Call
                                            </button>
                                        </div>
                                    </div>

                                    <div className="border border-green-100 rounded-lg p-3 bg-green-50/50">
                                        <h4 className="text-green-800 font-bold text-sm mb-2 text-center">PUT (看多/中性)</h4>
                                        <div className="flex gap-2 justify-center">
                                            <button 
                                                onClick={() => executeTrade('put', spotPrice - 100, 5, 'sell')}
                                                className="flex-1 px-2 py-2 bg-white border border-green-300 text-green-700 rounded hover:bg-green-50 text-xs font-medium shadow-sm"
                                            >
                                                Sell Put
                                            </button>
                                            <button 
                                                onClick={() => executeTrade('put', 29900, 5, 'buy')}
                                                className="flex-1 px-2 py-2 bg-white border border-green-300 text-green-700 rounded hover:bg-green-50 text-xs font-medium shadow-sm"
                                            >
                                                Buy Put
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <h3 className="text-sm font-semibold text-gray-500 mb-2">操作紀錄</h3>
                                <div className="flex-1 bg-gray-50 rounded border p-3 overflow-y-auto max-h-40">
                                    {logs.length === 0 && <p className="text-gray-400 text-xs text-center mt-4">尚無操作紀錄</p>}
                                    <ul className="space-y-2">
                                        {logs.map((log, index) => (
                                            <li key={index} className="text-xs text-gray-600 flex gap-2">
                                                <span className="text-gray-400 font-mono shrink-0">[{log.time}]</span>
                                                <span>{log.msg}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>

                        </div>

                        {/* 說明區塊 */}
                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 text-sm text-blue-800 flex gap-3">
                            <InfoIcon className="shrink-0 mt-0.5" size={18} />
                            <div>
                                <h4 className="font-bold mb-1">關於動態平衡邏輯</h4>
                                <div>
                                    本模擬器依據您提供的圖片邏輯設計：
                                    <ul className="list-disc pl-5 mt-1 space-y-1">
                                        <li>核心公式：<code className="bg-blue-100 px-1 rounded">平衡比例 = Call總點數 / (Call總點數 + Put總點數)</code>。</li>
                                        <li>目標是將比例維持在 <strong>50%</strong> 左右 (蹺蹺板水平)，達到權利金中性。</li>
                                        <li>當市場 <strong>下跌</strong> (Call變輕/Put變重)，蹺蹺板向右傾斜。若資金足夠，應 <strong>Sell Call</strong> (增加左側重量) 來拉回平衡。</li>
                                        <li>當市場 <strong>上漲</strong> (Call變重/Put變輕)，蹺蹺板向左傾斜。若資金足夠，應 <strong>Sell Put</strong> (增加右側重量)。</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DynamicBalancingApp />);
    </script>
</body>
</html>
