<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇權教學網站 - 由淺入深</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // SVG 圖標組件（避免外部依賴載入失敗）
        const Icons = {
            BookOpen: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>,
            Book: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Target: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            ShieldCheck: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>,
            ChevronRight: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>,
            TrendingUp: () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>,
            Info: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            Menu: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>,
            X: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l18 18"></path></svg>
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(true);

            const chapters = [
                {
                    id: 'level1',
                    title: '第一章：地基打造 - 基礎入門',
                    icon: <Icons.Book />,
                    subpages: [
                        { id: '1-1', title: '什麼是選擇權？', summary: '利用保險與房屋訂金的概念，輕鬆理解權利與義務的本質。' },
                        { id: '1-2', title: '四大基本動作', summary: '深入解析 Buy Call, Sell Call, Buy Put, Sell Put 的核心邏輯。' },
                        { id: '1-3', title: '專有名詞大解析', summary: '履約價、權利金、到期日、價內外 (ITM/OTM) 等必備術語。' }
                    ]
                },
                {
                    id: 'level2',
                    title: '第二章：進階維度 - 定價與變數',
                    icon: <Icons.Settings />,
                    subpages: [
                        { id: '2-1', title: '權利金的結構', summary: '解析內涵價值與時間價值的消長關係。' },
                        { id: '2-2', title: '希臘字母 (The Greeks)', summary: 'Delta, Gamma, Theta, Vega 在實戰中的意義與應用。' },
                        { id: '2-3', title: '隱含波動率 (IV)', summary: '理解市場的情緒波動，判斷現在權利金是貴還是便宜。' }
                    ]
                },
                {
                    id: 'level3',
                    title: '第三章：戰術圖譜 - 組合策略',
                    icon: <Icons.Target />,
                    subpages: [
                        { id: '3-1', title: '價差策略 (Spreads)', summary: '牛市價差、熊市價差：風險有限且成本降低的穩健打法。' },
                        { id: '3-2', title: '收租型策略', summary: 'Covered Call 與 Cash Secured Put：適合存股族的長期加薪工具。' },
                        { id: '3-3', title: '跨式與勒式策略', summary: '不預測市場方向，只賭市場即將出現大波動的交易法。' }
                    ]
                },
                {
                    id: 'level4',
                    title: '第四章：王者之路 - 風險與心法',
                    icon: <Icons.ShieldCheck />,
                    subpages: [
                        { id: '4-1', title: '資金管理', summary: '部位大小控制、保證金分配與凱利準則的應用。' },
                        { id: '4-2', title: '動態調整 (Adjustment)', summary: '當市場走勢不如預期時，如何進行救火、轉倉或停損。' },
                        { id: '4-3', title: '交易日誌與紀律', summary: '克服人性恐懼與貪婪，建立一套可重複執行的機械化系統。' }
                    ]
                }
            ];

            const renderContent = () => {
                if (activeTab === 'home') {
                    return (
                        <div className="space-y-8 animate-fade-in">
                            <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-10 rounded-2xl shadow-xl">
                                <h1 className="text-3xl md:text-4xl font-bold mb-4">掌握選擇權：從新手到高手的進階之路</h1>
                                <p className="text-lg opacity-90 max-w-2xl">
                                    這不只是一本書，而是一套完整的交易系統。我們將複雜的金融工具拆解成生活化的語言，助你在風險中看見獲利機會。
                                </p>
                                <button 
                                    onClick={() => setActiveTab('level1')}
                                    className="mt-8 bg-white text-blue-800 px-6 py-3 rounded-full font-bold hover:bg-blue-50 transition-colors flex items-center gap-2"
                                >
                                    開始探索學習 <Icons.ChevronRight />
                                </button>
                            </div>

                            <div className="grid md:grid-cols-3 gap-6">
                                <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                                    <div className="text-blue-600 mb-4"><Icons.BookOpen /></div>
                                    <h3 className="text-xl font-bold mb-2">易懂的教學文案</h3>
                                    <p className="text-gray-600 text-sm">拒絕艱澀的數學公式，用生活比喻帶你快速進入選擇權的核心邏輯。</p>
                                </div>
                                <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                                    <div className="text-green-600 mb-4"><Icons.TrendingUp /></div>
                                    <h3 className="text-xl font-bold mb-2">實戰導向架構</h3>
                                    <p className="text-gray-600 text-sm">強調策略損益圖模擬，讓你清楚知道每一筆交易的風險上限與獲利潛力。</p>
                                </div>
                                <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                                    <div className="text-red-600 mb-4"><Icons.ShieldCheck /></div>
                                    <h3 className="text-xl font-bold mb-2">風險控管至上</h3>
                                    <p className="text-gray-600 text-sm">高手比的是誰活得久。深入探討部位管理與救火技巧，守住你的本金。</p>
                                </div>
                            </div>
                        </div>
                    );
                }

                const currentChapter = chapters.find(c => c.id === activeTab);
                return (
                    <div className="space-y-6 animate-fade-in">
                        <div className="flex items-center gap-3 mb-4 text-blue-700">
                            <div className="p-3 bg-blue-100 rounded-lg">{currentChapter.icon}</div>
                            <h2 className="text-2xl md:text-3xl font-bold">{currentChapter.title}</h2>
                        </div>
                        
                        <div className="grid gap-4">
                            {currentChapter.subpages.map((page) => (
                                <div key={page.id} className="group bg-white p-6 rounded-xl border border-gray-200 hover:border-blue-400 hover:shadow-md transition-all cursor-pointer">
                                    <div className="flex justify-between items-start">
                                        <div className="flex-1">
                                            <span className="text-xs font-bold text-blue-600 uppercase tracking-wider">{page.id}</span>
                                            <h4 className="text-xl font-bold text-gray-800 mt-1">{page.title}</h4>
                                            <p className="text-gray-600 mt-2">{page.summary}</p>
                                        </div>
                                        <div className="text-gray-300 group-hover:text-blue-500 transition-colors ml-4">
                                            <Icons.ChevronRight />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="bg-blue-50 border-l-4 border-blue-500 p-5 rounded-r-lg mt-8">
                            <div className="flex gap-3">
                                <div className="text-blue-500 shrink-0"><Icons.Info /></div>
                                <div className="text-sm text-blue-800">
                                    <p className="font-bold mb-1 text-base">編輯提示 (Editor Note):</p>
                                    <p className="italic">
                                        在 Google 協作平台實際發布時，建議在此章節插入「{currentChapter.title}」相關的損益圖表以強化視覺直覺。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row">
                    {/* 側邊導覽列 */}
                    <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-200 transform transition-transform duration-300 ease-in-out ${isMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0`}>
                        <div className="p-6 h-full flex flex-col">
                            <div className="flex items-center gap-2 mb-8">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">Ω</div>
                                <h2 className="text-lg font-bold tracking-tight text-gray-800">選擇權百科</h2>
                            </div>
                            
                            <nav className="space-y-1 flex-1 overflow-y-auto">
                                <button 
                                    onClick={() => setActiveTab('home')}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === 'home' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    <Icons.BookOpen /> 網站首頁
                                </button>
                                
                                <div className="pt-6 pb-2 text-xs font-semibold text-gray-400 uppercase tracking-widest px-4">課程內容</div>
                                
                                {chapters.map((chapter) => (
                                    <button
                                        key={chapter.id}
                                        onClick={() => setActiveTab(chapter.id)}
                                        className={`w-full flex items-center gap-3 px-4 py-2 rounded-lg text-sm font-medium transition-colors ${activeTab === chapter.id ? 'bg-blue-50 text-blue-700 border-r-4 border-blue-700 rounded-r-none' : 'text-gray-600 hover:bg-gray-100'}`}
                                    >
                                        <div className="shrink-0">{chapter.icon}</div>
                                        <span className="truncate">{chapter.title}</span>
                                    </button>
                                ))}
                            </nav>
                            
                            <div className="mt-auto p-4 bg-gray-50 rounded-lg text-xs text-gray-500">
                                <p>規劃進度：4 大章節</p>
                                <div className="w-full bg-gray-200 h-1 rounded-full mt-2 overflow-hidden">
                                    <div className="bg-blue-500 h-full w-1/4"></div>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
                        {/* 行動裝置標題欄 */}
                        <header className="md:hidden flex items-center justify-between p-4 bg-white border-b border-gray-200 shrink-0">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">Ω</div>
                                <span className="font-bold">選擇權百科</span>
                            </div>
                            <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2 text-gray-500">
                                {isMenuOpen ? <Icons.X /> : <Icons.Menu />}
                            </button>
                        </header>

                        {/* 捲動內容區 */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-10">
                            <div className="max-w-4xl mx-auto w-full">
                                {renderContent()}
                                
                                <footer className="mt-20 pb-10 pt-8 border-t border-gray-200 text-center text-gray-400 text-xs">
                                    <p>© 2024 選擇權基本知識 | 專業寫作教學架構</p>
                                    <p className="mt-1">適用於 Google 協作平台嵌入式組件</p>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
