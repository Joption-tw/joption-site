middle">1 天</text><rect x="440" y="120" width="60" height="159.5" fill="#17142b"/><text x="470" y="305.5" font-size="21" font-weight="900" fill="#17142b" text-anchor="middle">−550</text><text x="570" y="66" font-size="18" font-weight="700" fill="#3a35c4" text-anchor="middle">46400</text><text x="570" y="88" font-size="16" font-weight="400" fill="#5c5870" text-anchor="middle">到期</text><rect x="540" y="120" width="60" height="217.5" fill="#17142b"/><text x="570" y="363.5" font-size="21" font-weight="900" fill="#17142b" text-anchor="middle">−750</text><line x1="16" y1="120" x2="624" y2="120" stroke="#17142b" stroke-width="3"/><rect x="24" y="204" width="296" height="92" rx="12" fill="#17142b"/><rect x="20" y="200" width="296" height="92" rx="12" fill="#fff1da" stroke="#17142b" stroke-width="2.5"/><text x="34" y="236" font-size="18" font-weight="700" fill="#17142b" text-anchor="start">收 650 點，衝過兩平點後</text><text x="34" y="270" font-size="18" font-weight="900" fill="#17142b" text-anchor="start">到期賠 750 點 ≈ 37,500 元</text></svg>
