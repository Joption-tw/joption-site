<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 365" width="640" height="365" role="img" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif"><title>下單機裝在自己的電腦，直接連期貨商伺服器，再到期交所撮合，沒有中央主機</title><rect width="640" height="365" fill="#fff"/><rect x="20" y="32" width="236" height="160" rx="12" fill="#17142b"/><rect x="16" y="28" width="236" height="160" rx="12" fill="#cff3fb" stroke="#17142b" stroke-width="2.5"/><text x="134" y="70" font-size="23" font-weight="900" fill="#17142b" text-anchor="middle">你的電腦</text><text x="134" y="100" font-size="17" font-weight="400" fill="#17142b" text-anchor="middle">下單機在這裡執行</text><rect x="38" y="126" width="200" height="46" rx="8" fill="#17142b"/><rect x="34" y="122" width="200" height="46" rx="8" fill="#fff" stroke="#17142b" stroke-width="2"/><text x="134" y="152" font-size="17" font-weight="900" fill="#3a35c4" text-anchor="middle">③ 本機風險運算</text><rect x="344" y="32" width="158" height="160" rx="12" fill="#17142b"/><rect x="340" y="28" width="158" height="160" rx="12" fill="#ffc62e" stroke="#17142b" stroke-width="2.5"/><text x="419" y="95" font-size="22" font-weight="900" fill="#17142b" text-anchor="middle">期貨商</text><text x="419" y="125" font-size="22" font-weight="900" fill="#17142b" text-anchor="middle">伺服器</text><rect x="538" y="62" width="92" height="100" rx="12" fill="#17142b"/><rect x="534" y="58" width="92" height="100" rx="12" fill="#fff1da" stroke="#17142b" stroke-width="2.5"/><text x="580" y="100" font-size="18" font-weight="900" fill="#17142b" text-anchor="middle">期交所</text><text x="580" y="128" font-size="16" font-weight="400" fill="#17142b" text-anchor="middle">撮合</text><line x1="264" y1="62" x2="322" y2="62" stroke="#17142b" stroke-width="3.5"/><path d="M322 54 L334 62 L322 70 Z" fill="#17142b"/><text x="299" y="54" font-size="18" font-weight="900" fill="#3a35c4" text-anchor="middle">①</text><line x1="332" y1="108" x2="274" y2="108" stroke="#17142b" stroke-width="3.5"/><path d="M274 100 L262 108 L274 116 Z" fill="#17142b"/><text x="299" y="100" font-size="18" font-weight="900" fill="#3a35c4" text-anchor="middle">②</text><line x1="264" y1="154" x2="322" y2="154" stroke="#17142b" stroke-width="3.5"/><path d="M322 146 L334 154 L322 162 Z" fill="#17142b"/><text x="299" y="146" font-size="18" font-weight="900" fill="#3a35c4" text-anchor="middle">④</text><line x1="514" y1="108" x2="522" y2="108" stroke="#17142b" stroke-width="3.5"/><path d="M514 100 L505 108 L514 116 Z M522 100 L531 108 L522 116 Z" fill="#17142b"/><text x="24" y="232" font-size="18" font-weight="700" fill="#17142b" text-anchor="start">① 訂閱報價、查詢庫存</text><text x="334" y="232" font-size="18" font-weight="700" fill="#17142b" text-anchor="start">② 回傳即時報價與部位</text><text x="24" y="264" font-size="18" font-weight="700" fill="#17142b" text-anchor="start">③ 在你的電腦算風險</text><text x="334" y="264" font-size="18" font-weight="700" fill="#17142b" text-anchor="start">④ 送出委託</text><rect x="20" y="290" width="610" height="64" rx="10" fill="#17142b"/><rect x="16" y="286" width="610" height="64" rx="10" fill="#fff" stroke="#17142b" stroke-width="2"/><text x="320" y="326" font-size="20" font-weight="900" fill="#3a35c4" text-anchor="middle">沒有中央主機：只在你的電腦和期貨商之間完成</text></svg>
