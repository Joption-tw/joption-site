<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" width="640" height="268" role="img" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif"><title>59 口自動抵銷重複單後剩 15 口，部位效果不變，保證金回到帳上</title><rect width="640" height="268" fill="#fff"/><text x="320" y="34" font-size="22" font-weight="900" fill="#17142b" text-anchor="middle">同一檔又買又賣，白白占用保證金</text><text x="24" y="95" font-size="19" font-weight="900" fill="#17142b" text-anchor="start">抵銷前</text><text x="24" y="119" font-size="19" font-weight="700" fill="#5c5870" text-anchor="start">59 口</text><rect x="118" y="72" width="167.2" height="58" fill="#cff3fb" stroke="#17142b" stroke-width="2.5"/><text x="201.6" y="108" font-size="20" font-weight="900" fill="#17142b" text-anchor="middle">買 22</text><rect x="285.2" y="72" width="281.2" height="58" fill="#ffc62e" stroke="#17142b" stroke-width="2.5"/><text x="425.8" y="108" font-size="20" font-weight="900" fill="#17142b" text-anchor="middle">賣 37</text><text x="320" y="170" font-size="19" font-weight="900" fill="#3a35c4" text-anchor="middle">▼ 自動抵銷重複單</text><text x="24" y="213" font-size="19" font-weight="900" fill="#17142b" text-anchor="start">抵銷後</text><text x="24" y="237" font-size="19" font-weight="700" fill="#5c5870" text-anchor="start">15 口</text><rect x="118" y="190" width="114.0" height="58" fill="#ffc62e" stroke="#17142b" stroke-width="2.5"/><text x="175.0" y="226" font-size="20" font-weight="900" fill="#17142b" text-anchor="middle">賣 15</text><text x="248.0" y="214" font-size="18" font-weight="700" fill="#17142b" text-anchor="start">部位效果不變、清單乾淨</text><text x="248.0" y="242" font-size="18" font-weight="700" fill="#17142b" text-anchor="start">保證金回到帳上繼續用</text></svg>
