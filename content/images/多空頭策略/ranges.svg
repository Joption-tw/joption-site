<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif"><title>三種策略的買權比值範圍：多頭 0.3～0.5、中性 0.4～0.6、空頭 0.5～0.7</title><rect width="600" height="300" fill="#fff"/><line x1="150.0" x2="150.0" y1="24" y2="236" stroke="#ece5d6" stroke-width="1.5" /><text x="150.0" y="262" font-size="16" fill="#5c5870" text-anchor="middle">0.2</text><line x1="220.0" x2="220.0" y1="24" y2="236" stroke="#ece5d6" stroke-width="1.5" /><text x="220.0" y="262" font-size="16" fill="#5c5870" text-anchor="middle">0.3</text><line x1="290.0" x2="290.0" y1="24" y2="236" stroke="#ece5d6" stroke-width="1.5" /><text x="290.0" y="262" font-size="16" fill="#5c5870" text-anchor="middle">0.4</text><line x1="360.0" x2="360.0" y1="24" y2="236" stroke="#c9c1b0" stroke-width="2" stroke-dasharray="6 5"/><text x="360.0" y="262" font-size="16" fill="#5c5870" text-anchor="middle">0.5</text><line x1="430.0" x2="430.0" y1="24" y2="236" stroke="#ece5d6" stroke-width="1.5" /><text x="430.0" y="262" font-size="16" fill="#5c5870" text-anchor="middle">0.6</text><line x1="500.0" x2="500.0" y1="24" y2="236" stroke="#ece5d6" stroke-width="1.5" /><text x="500.0" y="262" font-size="16" fill="#5c5870" text-anchor="middle">0.7</text><line x1="570.0" x2="570.0" y1="24" y2="236" stroke="#ece5d6" stroke-width="1.5" /><text x="570.0" y="262" font-size="16" fill="#5c5870" text-anchor="middle">0.8</text><text x="20" y="66" font-size="20" font-weight="900" fill="#17142b">多頭</text><text x="20" y="88" font-size="14" fill="#5c5870">Put 多</text><rect x="224.0" y="44" width="140.0" height="44" rx="12" fill="#17142b"/><rect x="220.0" y="40" width="140.0" height="44" rx="12" fill="#7fd8ee" stroke="#17142b" stroke-width="3"/><text x="290.0" y="69" font-size="18" font-weight="900" fill="#17142b" text-anchor="middle">0.3～0.5</text><text x="20" y="132" font-size="20" font-weight="900" fill="#17142b">中性</text><text x="20" y="154" font-size="14" fill="#5c5870">一樣重</text><rect x="294.0" y="110" width="140.0" height="44" rx="12" fill="#17142b"/><rect x="290.0" y="106" width="140.0" height="44" rx="12" fill="#ffc62e" stroke="#17142b" stroke-width="3"/><text x="360.0" y="135" font-size="18" font-weight="900" fill="#17142b" text-anchor="middle">0.4～0.6</text><text x="20" y="198" font-size="20" font-weight="900" fill="#17142b">空頭</text><text x="20" y="220" font-size="14" fill="#5c5870">Call 多</text><rect x="364.0" y="176" width="140.0" height="44" rx="12" fill="#17142b"/><rect x="360.0" y="172" width="140.0" height="44" rx="12" fill="#3a35c4" stroke="#17142b" stroke-width="3"/><text x="430.0" y="201" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">0.5～0.7</text><text x="360.0" y="290" font-size="14" fill="#5c5870" text-anchor="middle">買權比值 = Call 點數 ÷（Call + Put 點數）</text></svg>